openapi: 3.0.0
info:
  title: Blink API
  version: '1.0'
  description: >-
    Unofficial documentation for the Client API of the Blink Wire-Free HD Home
    Monitoring & Alert System. I am not affiliated with the company in any way -
    this documentation is strictly "AS-IS". If you want to see an functional
    python implementation you can find one in my profile
    https://www.github.com/mpedreira
servers:
  - url: https://rest-prod.immedia-semi.com
  - url: https://rest-e001.immedia-semi.com
  - url: https://rest-e002.immedia-semi.com
  - url: https://rest-e003.immedia-semi.com
  - url: https://rest-e004.immedia-semi.com
  - url: https://rest-e005.immedia-semi.com
  - url: https://rest-e006.immedia-semi.com
  - url: https://rest-e007.immedia-semi.com
  - url: https://rest-e008.immedia-semi.com
  - url: https://rest-e009.immedia-semi.com
  - url: https://rest-e010.immedia-semi.com
  - url: https://api.oauth.blink.com
    description: OAuth 2.0 Authorization Server
paths:
  /oauth/v2/authorize:
    get:
      servers:
        - url: https://api.oauth.blink.com
      summary: "Step 1 – Initiate OAuth PKCE flow"
      description: >
        Starts the Authorization Code + PKCE flow. Sets session cookies on the
        OAuth server. Must be called before POST /oauth/v2/signin.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            example: ios
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            example: base64url-encoded-SHA256-of-verifier
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: hardware_id
          in: query
          required: true
          schema:
            type: string
            example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            example: immedia-blink://applinks.blink.com/signin/callback
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: client
        - name: app_brand
          in: query
          schema:
            type: string
            example: blink
        - name: app_version
          in: query
          schema:
            type: string
            example: '50.1'
        - name: device_brand
          in: query
          schema:
            type: string
            example: Apple
        - name: device_model
          in: query
          schema:
            type: string
            example: iPhone16,1
        - name: device_os_version
          in: query
          schema:
            type: string
            example: '26.1'
      responses:
        '200':
          description: HTML signin page. Session cookies are set for subsequent calls.
      tags:
        - auth

  /oauth/v2/signin:
    get:
      servers:
        - url: https://api.oauth.blink.com
      summary: "Step 2 – Get signin page and CSRF token"
      description: >
        Returns the HTML signin page. Extract the CSRF token from the JSON block
        inside <script id="oauth-args" type="application/json">.
      responses:
        '200':
          description: HTML signin page containing the embedded CSRF token.
      tags:
        - auth
    post:
      servers:
        - url: https://api.oauth.blink.com
      summary: "Step 3 – Submit credentials"
      description: >
        Submits username, password and csrf-token as application/x-www-form-urlencoded.
        Returns 412 when 2FA is required (call POST /oauth/v2/2fa/verify next).
        Returns a 3xx redirect with the auth code when 2FA is not configured.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthSigninPayload'
      responses:
        '302':
          description: >
            Direct auth-code redirect (no 2FA). Follow Location header back to
            GET /oauth/v2/authorize then exchange the code at POST /oauth/token.
        '412':
          description: 2FA required. Send OTP to POST /oauth/v2/2fa/verify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2faRequired'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login_error_response'
      tags:
        - auth

  /oauth/v2/2fa/verify:
    post:
      servers:
        - url: https://api.oauth.blink.com
      summary: "Step 3b – Verify 2FA OTP"
      description: >
        Verifies the SMS one-time password received after a 412 from
        POST /oauth/v2/signin. On success (201) the session is authorised;
        follow with GET /oauth/v2/authorize then POST /oauth/token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuth2faPayload'
      responses:
        '201':
          description: 2FA verified. Session is now authorised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2faResponse'
        '401':
          description: Invalid or expired OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login_error_response'
      tags:
        - auth

  /oauth/token:
    post:
      servers:
        - url: https://api.oauth.blink.com
      summary: "Steps 5 & 7 – Exchange auth code or refresh access token"
      description: >
        Two uses depending on grant_type.
        authorization_code: exchange the PKCE auth code + code_verifier for
        access_token and refresh_token (Steps 4-5 of the PKCE flow).
        refresh_token: silent renewal using the stored refresh_token, no 2FA needed.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenPayload'
      responses:
        '200':
          description: Tokens issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Invalid grant or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/login_error_response'
      tags:
        - auth

