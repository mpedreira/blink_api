    OAuthSigninPayload:
      type: object
      description: Form fields for POST /oauth/v2/signin
      properties:
        username:
          type: string
          example: me@gmail.com
        password:
          type: string
          example: tH1s1s4P@ssw0rd
        'csrf-token':
          type: string
          example: abc123def456
      required:
        - username
        - password
        - 'csrf-token'
      title: OAuthSigninPayload
    OAuth2faPayload:
      type: object
      description: Form fields for POST /oauth/v2/2fa/verify
      properties:
        '2fa_code':
          type: string
          example: '123456'
        'csrf-token':
          type: string
          example: abc123def456
        remember_me:
          type: string
          enum: ['true', 'false']
          example: 'false'
      required:
        - '2fa_code'
        - 'csrf-token'
      title: OAuth2faPayload
    OAuthTokenPayload:
      type: object
      description: >
        Form fields for POST /oauth/token.
        Use grant_type=authorization_code for PKCE code exchange or
        grant_type=refresh_token for silent renewal.
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
          example: authorization_code
        client_id:
          type: string
          example: ios
        scope:
          type: string
          example: client
        hardware_id:
          type: string
          example: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
        code:
          type: string
          description: Authorization code. Required for authorization_code grant.
        code_verifier:
          type: string
          description: PKCE verifier. Required for authorization_code grant.
        redirect_uri:
          type: string
          example: immedia-blink://applinks.blink.com/signin/callback
          description: Required for authorization_code grant.
        refresh_token:
          type: string
          description: Required for refresh_token grant.
        app_brand:
          type: string
          example: blink
      required:
        - grant_type
        - client_id
      title: OAuthTokenPayload
